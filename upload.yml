name: Video Uploader to Pomf2

on:
  workflow_dispatch: # تشغيل يدوي

jobs:
  upload_video:
    runs-on: ubuntu-latest

    steps:
      - name: Download Video
        run: |
          # تحميل الفيديو وحفظه باسم video.mp4
          # استخدمت الكوتشينات " " لأن الرابط يحتوي على رموز خاصة
          curl -L "https://abra--5e4bd524.api.cosmic-crab.buzz/f156c9e34b9b191a93ec53d5e1587ce27f3151ee/%D8%A3%D8%A8%D8%B7%D8%A7%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D8%AC%D9%8A%D8%AA%D8%A7%D9%84%20%D8%B3%D8%A8%D9%8A%D8%B3%D8%AA%D9%88%D9%86%20265/04.mp4?api-key=8acbcf1e-732c-4574-a3bf-27e6a85b86f1&download=true&token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..vUfkDyn-pWlaCDWpaTNF5z0OOANrClOWcGHWhby9esA" -o video.mp4

      - name: Upload to Pomf2
        run: |
          echo "جاري الرفع إلى Pomf2..."
          # الرفع باستخدام API الخاص بالموقع
          RESPONSE=$(curl -F "files[]=@video.mp4" https://pomf2.lain.la/upload.php)
          
          # استخراج الرابط من استجابة JSON
          FILE_URL=$(echo $RESPONSE | jq -r '.files[0].url')
          
          echo "------------------------------------------"
          echo "تم الرفع بنجاح!"
          echo "الرابط المباشر الجديد هو: $FILE_URL"
          echo "------------------------------------------"
